# ProsperoRadio - Lint, test, build, and release validation.
# Petunia (Oliv3rmoon/Petunia): a version tag pushed to that repository builds the app folder's
# ZIP (<title ID>.zip, PPSA99017.zip) and SHA256SUMS, attests the ZIP and puts both on the tag's
# GitHub release: a release made first (a draft, as every test release is) gets the files and
# stays as it is; without one, the run makes a draft pre-release, so nothing is published by a
# tag alone. The app's update check offers published releases (third_party/update_check/
# github_release.h).
# Copyright (C) 2026 BlackBearReloaded
# SPDX-License-Identifier: GPL-3.0-or-later

name: Build

on:
  # A build on main is started by hand (Run workflow): pushes to main build nothing.
  push:
    tags:
      - "[0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]"
  pull_request:
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Also hand over this run's compiler cache as the build-cache snapshot (run it on main)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, and build the release ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # The two write entries are for the attestation step only: a signing identity for this run,
    # and storing the attestation. A pull request from a fork gets neither, whatever is asked.
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.deps/ccache
      CCACHE_MAXSIZE: 500M

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 clang-format-18 clang-tidy-18 lld-18 libclang-rt-18-dev libsqlite3-dev make ccache pkg-config tar unzip wget zip cmake ninja-build meson bison flex python3-mako python3-markupsafe build-essential glslang-tools spirv-tools libegl-dev libgl-dev libzstd-dev

      # The ps5-opengl SDK is built from source at the commit tools/build-opengl-sdk.sh pins (its
      # prebuilt releases went with the original repository), with these Python modules.
      - name: Install the OpenGL SDK build's Python modules
        run: python3 -m pip install "meson==1.10.1" PyYAML Mako packaging pyelftools ply Jinja2 pycparser setuptools wheel

      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-clang18-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-clang18-

      # GitHub drops a cache nobody used for a week, and a pull request only sees main's. When
      # nothing was restored, start from the snapshot kept as a file of the build-cache release;
      # a manual run with "snapshot" ticked hands over a new one.
      - name: Fetch the compiler cache snapshot
        run: |
          if [ -z "$(ls -A "$CCACHE_DIR" 2>/dev/null)" ]; then
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/build-cache/ccache-clang18.tar"
            # This repository's own snapshot; a repository without one (yet) builds from nothing.
            if curl -fsSL --retry 3 -o "$RUNNER_TEMP/ccache-clang18.tar" "$url" &&
                mkdir -p "$CCACHE_DIR" && tar -xf "$RUNNER_TEMP/ccache-clang18.tar" -C "$CCACHE_DIR"; then
              echo "::notice title=Compiler cache::Started from the build-cache snapshot."
            else
              echo "::notice title=Compiler cache::No build-cache snapshot here; building without one."
            fi
            rm -f "$RUNNER_TEMP/ccache-clang18.tar"
          fi

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Read app identity and version
        shell: bash
        run: |
          metadata=$(python3 -c 'import json; p=json.load(open("sce_sys/param.json")); print(p["titleId"], p["contentVersion"])')
          read -r title_id content_version <<< "$metadata"
          [[ $title_id =~ ^PPSA[0-9]{5}$ ]] || exit 2
          [[ $content_version =~ ^[0-9]{2}\.[0-9]{3}\.[0-9]{3}$ ]] || exit 2
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "$content_version" ]]; then
            echo "Release tag must exactly match param.json contentVersion: $content_version" >&2
            exit 2
          fi
          # Petunia: the name and the data name come from param.json too (tools/app-identity.py).
          app_name=$(python3 tools/app-identity.py --get APP_TITLE_NAME)
          data_name=$(python3 tools/app-identity.py --get APP_DATA_NAME)
          {
            echo "TITLE_ID=$title_id"
            echo "CONTENT_VERSION=$content_version"
            echo "APP_NAME=$app_name"
            echo "DATA_NAME=$data_name"
          } >> "$GITHUB_ENV"

      # A pull request's build is named by its number and its own commit, on the
      # artifact and inside the app folder (docs/PULL_REQUEST_BUILDS.md); the version
      # in param.json stays the release's.
      - name: Name this build
        id: label
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            short=${PR_HEAD:0:7}
            echo "artifact=${GITHUB_REPOSITORY##*/}-PR$PR_NUMBER-$short" >> "$GITHUB_OUTPUT"
            echo "BUILD_LABEL=PR $PR_NUMBER, $short" >> "$GITHUB_ENV"
          else
            echo "artifact=$DATA_NAME-$GITHUB_SHA-release" >> "$GITHUB_OUTPUT"
          fi

      # clang-tidy stays a local check (make lint / make tidy); it does not run here.
      - name: Lint source and metadata
        run: LINT_SKIP_TIDY=1 make lint

      - name: Run host GoogleTest suite
        run: make test-unit HOST_CXX="ccache clang++"

      - name: Run host integration tests
        run: make test-integration

      - name: Reproduce clean-room runtime shim
        run: make libc

      - name: Verify generated runtime is unchanged
        run: cd runtime && sha256sum -c libc.prx.sha256

      # The SDK build takes a while and only changes with the pinned commit: keep the finished SDK.
      - name: Restore the ps5-opengl SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .deps/ps5-opengl-source/build/sdk
            .deps/ps5-opengl-source/build/.sdk-commit
          key: ps5-opengl-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build-opengl-sdk.sh') }}

      - name: Build the ps5-opengl SDK
        run: bash tools/prepare-opengl.sh

      # tools/build.sh compiles through ccache whenever it is installed.
      - name: Build the app folder
        run: make app

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats

      # ccache compresses what it stores, so the snapshot is a plain tar.
      - name: Pack the compiler cache snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        run: tar -cf "$RUNNER_TEMP/ccache-clang18.tar" -C "$CCACHE_DIR" .

      - name: Upload the compiler cache snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ccache-snapshot
          path: ${{ runner.temp }}/ccache-clang18.tar
          if-no-files-found: error
          retention-days: 1

      - name: Archive app folder
        run: |
          cd dist && zip -qr "$TITLE_ID.zip" "$TITLE_ID"
          # Every entry stored as 0777: the console only starts an app whose files are open to all.
          python3 ../tools/zip-open-modes.py "$TITLE_ID.zip"

      - name: Verify app-folder archive
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          unzip -t "$TITLE_ID.zip"
          unzip -Z1 "$TITLE_ID.zip" | grep -Fx "$TITLE_ID/eboot.bin"
          unzip -Z1 "$TITLE_ID.zip" | grep -Fx "$TITLE_ID/sce_sys/param.json"
          unzip -Z1 "$TITLE_ID.zip" | grep -Fx "$TITLE_ID/sce_sys/icon0.png"
          python3 - "$TITLE_ID.zip" "$TITLE_ID" "$CONTENT_VERSION" "$APP_NAME" <<'PY'
          import json, sys, zipfile
          path, title, version, name = sys.argv[1:]
          with zipfile.ZipFile(path) as z:
              wrong = [i.filename for i in z.infolist() if (i.external_attr >> 16) & 0o777 != 0o777]
              assert not wrong, f"entries not stored as 0777: {wrong[:3]}"
              # Petunia: the ZIP holds the app it names, and not the logo's source.
              assert not [n for n in z.namelist() if "/assets/branding/" in n], "assets/branding packaged"
              param = json.loads(z.read(f"{title}/sce_sys/param.json"))
              shown = param["localizedParameters"]["en-US"]["titleName"]
              assert (param["titleId"], param["contentVersion"], shown) == (title, version, name), \
                  f"param.json is {param['titleId']} {param['contentVersion']} {shown!r}"
              print(f"{path}: {len(z.infolist())} entries, all 0777; {title} {version} {shown!r}")
          PY

      - name: Write release checksums
        run: cd dist && sha256sum "$TITLE_ID.zip" > SHA256SUMS

      # Signed provenance: this ZIP was built by this workflow from this commit. Anyone can check a
      # downloaded copy with `gh attestation verify <file> -R <owner>/<repo>`. Not for pull requests
      # (a fork's run cannot sign), and not in a private repository (the plan does not include it).
      - name: Attest the release ZIP
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.TITLE_ID }}.zip

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.label.outputs.artifact }}
          path: |
            dist/${{ env.TITLE_ID }}.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out the identity and the release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            sce_sys/param.json
            tools/app-identity.py
            CHANGELOG.md
            docs/releases
          sparse-checkout-cone-mode: false

      - name: Read the app's name
        run: |
          {
            echo "APP_NAME=$(python3 tools/app-identity.py --get APP_TITLE_NAME)"
            echo "DATA_NAME=$(python3 tools/app-identity.py --get APP_DATA_NAME)"
          } >> "$GITHUB_ENV"

      - name: Download verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "$GITHUB_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "$DATA_NAME-$GITHUB_SHA-release"
          --dir release

      - name: Prepare release assets
        id: package
        shell: bash
        run: |
          set -euo pipefail
          cd release
          mapfile -d '' files < <(find . -type f -print0)
          shopt -s nullglob
          archives=(PPSA*.zip)
          if (( ${#files[@]} != 2 || ${#archives[@]} != 1 )) || [[ ! -f SHA256SUMS ]]; then
            echo "Expected one app-folder ZIP and SHA256SUMS at the artifact root." >&2
            exit 1
          fi
          sha256sum -c SHA256SUMS
          unzip -t "${archives[0]}"
          echo "archive=${archives[0]}" >> "$GITHUB_OUTPUT"
          echo "checksum=SHA256SUMS" >> "$GITHUB_OUTPUT"

      # docs/releases/<tag>.md is the release's page when there is one; otherwise the tag's
      # section of CHANGELOG.md. Used only when this run makes the release.
      - name: Prepare release notes
        shell: bash
        run: |
          if [[ -f docs/releases/$GITHUB_REF_NAME.md ]]; then
            cp "docs/releases/$GITHUB_REF_NAME.md" release-notes.md
            exit 0
          fi
          awk -v version="$GITHUB_REF_NAME" '
            $0 == "## " version { found=1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      # Petunia: as Dulcamara's build.yml. The files of a release come from the run of its tag,
      # once. A release that is there already (a draft made before the tag, or notes written in
      # advance) gets them and keeps its title, notes and state: a draft stays a draft until it is
      # dropped. One that already has a ZIP is never touched, because the update check takes that
      # ZIP's checksum from its SHA256SUMS. Without a release, the run makes a draft pre-release:
      # a tag alone publishes nothing.
      - name: Put the files on the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          assets=("release/$ARCHIVE" "release/$CHECKSUM")
          TAG=$GITHUB_REF_NAME
          if names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null); then
            if grep -qx "$ARCHIVE" <<< "$names"; then
              echo "::warning title=Release files not from this run::The release $TAG already has $ARCHIVE; it was not replaced. Its files were not published by this run and may have no attestation."
            else
              gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft --prerelease --latest=false \
              --notes-file release-notes.md \
              --title "$APP_NAME $TAG"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets \
            --jq '"draft: \(.isDraft), pre-release: \(.isPrerelease), files: \([.assets[].name] | join(", "))"'
